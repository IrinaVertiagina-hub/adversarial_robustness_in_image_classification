name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
        pip install adversarial-robustness-toolbox mlflow

    - name: Check imports
      run: |
        python -c "import torch; import torchvision; import mlflow; print('All imports OK')"

    - name: Lint with flake8
      run: |
        pip install flake8
        flake8 src/ --max-line-length=120 --ignore=E402,W503

    - name: Docker build
      run: |
        docker build -t adversarial-robustness .